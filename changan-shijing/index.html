<style>
:root{
  --gold:#e8c476; --gold-l:#f6e3ae; --gold-d:#b98d3e;
  --ink:#f5ecd9; --ink-dim:#c9bfa8; --ink-faint:#9a917d;
  --bg:#080d1f; --panel:rgba(10,17,38,.62); --panel-l:rgba(20,30,60,.72);
  --line:rgba(232,196,118,.35);
  --red:#c3452f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#05070f radial-gradient(ellipse at 50% 0%, #101a3a 0%, #05070f 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  color:var(--ink);overflow:hidden;
}
/* ---------- 手机壳 ---------- */
#phone{
  position:relative;width:min(430px,100vw);height:min(932px,100vh);
  overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 1px rgba(232,196,118,.18),0 30px 80px rgba(0,0,0,.8);
}
@media (min-width:500px){#phone{border-radius:44px;border:1px solid rgba(232,196,118,.25)}}
/* ---------- 屏幕切换 ---------- */
.screen{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .45s ease,transform .45s ease;transform:translateY(12px);
  background-size:cover;background-position:center;
  display:flex;flex-direction:column;
}
.screen.active{opacity:1;pointer-events:auto;transform:none;z-index:2}
.bg{position:absolute;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(5,8,20,.55) 0%,rgba(5,8,20,.12) 30%,rgba(5,8,20,.18) 60%,rgba(5,8,20,.78) 100%)}
.content{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 54px) 22px calc(env(safe-area-inset-bottom,0px) + 26px);overflow:hidden}
/* ---------- 通用组件 ---------- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px}
.backbtn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,31,.55);border:1px solid var(--line);color:var(--gold-l);cursor:pointer;
  backdrop-filter:blur(8px);font-size:19px;transition:.2s;flex:none;
}
.backbtn:active{transform:scale(.92)}
.screen-title{margin-left:12px;font-size:16px;letter-spacing:4px;color:var(--gold-l);text-shadow:0 0 12px rgba(232,196,118,.4)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:14px;border:1px solid var(--line);cursor:pointer;
  background:linear-gradient(135deg,rgba(232,196,118,.95),rgba(185,141,62,.92));
  color:#22160a;font-size:17px;letter-spacing:6px;font-weight:700;
  box-shadow:0 6px 24px rgba(232,196,118,.28),inset 0 1px 0 rgba(255,255,255,.5);
  transition:.22s;font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn:disabled,.btn[disabled]{
  opacity:.42;cursor:not-allowed;filter:saturate(.5);
  box-shadow:none;transform:none;
}
.btn.ghost{
  background:rgba(10,17,38,.55);color:var(--gold-l);border:1px solid var(--line);
  box-shadow:none;backdrop-filter:blur(8px);font-weight:400;
}
.btn.small{width:auto;padding:9px 18px;font-size:13.5px;letter-spacing:3px;border-radius:10px}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 40px rgba(0,0,0,.45);
}
.tag{
  display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:2px;
  border:1px solid var(--line);color:var(--gold-l);background:rgba(232,196,118,.08);margin:3px 4px 3px 0;
}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:14px 0}
.divider-title{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:5px;color:var(--ink-dim);margin:16px 0 10px}
.divider-title::before,.divider-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider-title::after{background:linear-gradient(90deg,var(--line),transparent)}
/* ---------- S1 首页 ---------- */
#s-home .content{justify-content:flex-end;align-items:center;text-align:center;padding-bottom:64px}
.home-brand{font-size:13px;letter-spacing:8px;color:var(--ink-dim);margin-bottom:14px}
.home-title{
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:52px;letter-spacing:10px;font-weight:700;
  color:var(--gold-l);text-shadow:0 0 24px rgba(232,196,118,.55),0 2px 6px rgba(0,0,0,.8);
  animation:glow 3.2s ease-in-out infinite;margin-bottom:10px;
}
@keyframes glow{0%,100%{text-shadow:0 0 18px rgba(232,196,118,.45)}50%{text-shadow:0 0 34px rgba(232,196,118,.85)}}
.home-sub{font-size:14px;letter-spacing:3px;color:var(--ink-dim);margin-bottom:8px}
.home-quote{
  font-family:"Kaiti SC","STKaiti",serif;font-size:15px;color:var(--ink);opacity:.85;letter-spacing:2px;
  margin:16px 0 34px;line-height:2;
}
.home-btns{width:78%;display:flex;flex-direction:column;gap:12px}
/* ---------- S2 地图 ---------- */
#s-map .content{padding-bottom:20px}
.layer-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.layer-tab{
  padding:8px 22px;border-radius:999px;font-size:14px;letter-spacing:4px;cursor:pointer;transition:.25s;
  background:rgba(10,17,38,.55);border:1px solid rgba(232,196,118,.25);color:var(--ink-dim);backdrop-filter:blur(8px);
}
.layer-tab.on{background:linear-gradient(135deg,rgba(232,196,118,.95),rgba(185,141,62,.9));color:#22160a;font-weight:700;border-color:transparent;box-shadow:0 4px 18px rgba(232,196,118,.35)}
.map-stage{position:relative;flex:1;border-radius:18px;overflow:hidden;border:1px solid rgba(232,196,118,.22);box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.map-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  cursor:pointer;z-index:4;transition:opacity .3s;
}
.hotspot .dot{
  width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffe9b0,#e8c476 60%,rgba(232,196,118,0) 72%);
  box-shadow:0 0 0 0 rgba(232,196,118,.7);animation:pulse 2s infinite;position:relative;
}
.hotspot.lit .dot{background:radial-gradient(circle,#fff6d8,#ffb84d 55%,rgba(255,184,77,0) 75%);box-shadow:0 0 22px 6px rgba(255,184,77,.65)}
.hotspot.lit .dot::after{content:"✦";position:absolute;top:-22px;font-size:13px;color:#ffd985;text-shadow:0 0 8px #ffb84d}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,196,118,.65)}70%{box-shadow:0 0 0 16px rgba(232,196,118,0)}100%{box-shadow:0 0 0 0 rgba(232,196,118,0)}}
.hotspot .lbl{
  margin-top:7px;padding:4px 12px;border-radius:10px;font-size:12.5px;letter-spacing:2px;white-space:nowrap;
  background:rgba(8,13,31,.72);border:1px solid var(--line);color:var(--gold-l);backdrop-filter:blur(6px);
}
.map-hint{text-align:center;font-size:12px;color:var(--ink-faint);letter-spacing:3px;margin:10px 0 12px}
.map-actions{display:flex;gap:10px;padding:0 4px}
/* ---------- S3 人物图谱 ---------- */
.poet-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto;padding:2px}
.poet-card{
  padding:18px 14px;border-radius:16px;cursor:pointer;transition:.25s;text-align:center;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);
}
.poet-card:active{transform:scale(.96)}
.poet-card .p-name{font-family:"Kaiti SC","STKaiti",serif;font-size:26px;letter-spacing:6px;color:var(--gold-l)}
.poet-card .p-title{font-size:12px;color:var(--ink-dim);letter-spacing:2px;margin-top:5px}
.poet-card .p-era{font-size:11px;color:var(--ink-faint);margin-top:2px}
/* ---------- 诗境页通用 ---------- */
.scroll-panel{border-radius:18px;padding:20px 18px;position:relative;background:linear-gradient(160deg,rgba(246,227,174,.13),rgba(246,227,174,.05));border:1px solid var(--line);backdrop-filter:blur(12px)}
.poem-line{
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:23px;letter-spacing:5px;line-height:2.1;color:var(--ink);
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.poem-line .em{color:var(--gold-l)}
.poem-src{font-size:12px;color:var(--ink-faint);letter-spacing:2px;margin-top:8px}
.big-name{font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:44px;letter-spacing:12px;color:var(--gold-l);text-shadow:0 0 20px rgba(232,196,118,.5)}
.big-sub{font-size:13px;letter-spacing:5px;color:var(--ink-dim);margin-top:6px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 16px;border-radius:12px;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.2s;
  background:rgba(10,17,38,.5);border:1px solid rgba(232,196,118,.28);color:var(--ink);backdrop-filter:blur(6px);
}
.chip.on{background:linear-gradient(135deg,rgba(232,196,118,.92),rgba(185,141,62,.85));color:#22160a;font-weight:700;border-color:transparent}
.poem-list-item{
  display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;cursor:pointer;
  background:rgba(10,17,38,.42);border:1px solid rgba(232,196,118,.18);margin-bottom:8px;transition:.2s;
}
.poem-list-item:active{background:rgba(232,196,118,.14)}
.poem-list-item .t{font-size:15px;letter-spacing:2px;color:var(--ink)}
.poem-list-item .f{font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.voice-btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;cursor:pointer;
  background:rgba(10,17,38,.55);border:1px solid var(--line);color:var(--gold-l);font-size:13.5px;letter-spacing:3px;transition:.25s;
}
.voice-btn.playing .ic{animation:wave 1s infinite}
@keyframes wave{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}
/* ---------- S6 诗会 ---------- */
.work-card{padding:15px 16px;border-radius:15px;background:var(--panel);border:1px solid rgba(232,196,118,.22);margin-bottom:10px;backdrop-filter:blur(10px)}
.work-card .w-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.work-card .w-author{font-size:12.5px;color:var(--ink-dim);letter-spacing:2px}
.work-card .w-poem{font-family:"Kaiti SC","STKaiti",serif;font-size:16.5px;line-height:1.9;letter-spacing:2px;color:var(--ink)}
.lamp-btn{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13px;border:1px solid var(--line);color:var(--gold-l);background:rgba(232,196,118,.08);transition:.2s;flex:none}
.lamp-btn:active{transform:scale(.92)}
.lamp-btn.lit{background:rgba(255,184,77,.22);border-color:#ffb84d;color:#ffd985}
/* ---------- S7 共创 ---------- */
.steps{display:flex;gap:6px;margin-bottom:14px}
.step-dot{flex:1;height:4px;border-radius:2px;background:rgba(232,196,118,.18);transition:.3s}
.step-dot.on{background:linear-gradient(90deg,var(--gold),var(--gold-d));box-shadow:0 0 10px rgba(232,196,118,.5)}
.gen-poem{
  text-align:center;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:24px;letter-spacing:4px;line-height:2.2;
  color:var(--ink);padding:22px 10px;
}
.gen-poem.appear .pl{opacity:0;filter:blur(6px);animation:inkIn .8s forwards}
.gen-poem .pl:nth-child(2){animation-delay:.35s}.gen-poem .pl:nth-child(3){animation-delay:.7s}.gen-poem .pl:nth-child(4){animation-delay:1.05s}.gen-poem .pl:nth-child(5){animation-delay:1.4s}
@keyframes inkIn{to{opacity:1;filter:blur(0)}}
.gen-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
textarea.userline{
  width:100%;background:rgba(10,17,38,.5);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  padding:12px 14px;font-size:15px;font-family:inherit;letter-spacing:2px;resize:none;outline:none;margin-top:10px;
}
textarea.userline:focus{border-color:var(--gold)}
/* ---------- S8 海报 ---------- */
#posterCanvas{width:100%;border-radius:14px;display:block;box-shadow:0 14px 44px rgba(0,0,0,.6)}
/* ---------- 底部抽屉(阅读) ---------- */
.sheet-mask{position:absolute;inset:0;z-index:20;background:rgba(4,7,16,.6);opacity:0;pointer-events:none;transition:.35s;backdrop-filter:blur(3px)}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);
  background:linear-gradient(180deg,#131d3d,#0a1128);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:22px 24px calc(env(safe-area-inset-bottom,0px) + 26px);max-height:78%;overflow-y:auto;
}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:rgba(232,196,118,.35);margin:0 auto 16px}
/* ---------- toast ---------- */
.toast{
  position:absolute;top:16%;left:50%;transform:translate(-50%,-8px);z-index:50;opacity:0;transition:.4s;pointer-events:none;
  padding:12px 26px;border-radius:14px;background:rgba(8,13,31,.85);border:1px solid var(--gold);color:var(--gold-l);
  font-size:15px;letter-spacing:3px;backdrop-filter:blur(10px);white-space:nowrap;box-shadow:0 0 30px rgba(232,196,118,.35);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.page-dots{display:flex;justify-content:center;gap:6px;margin:2px 0 8px}
.page-dots i{width:5px;height:5px;border-radius:50%;background:rgba(232,196,118,.3)}
.page-dots i.on{background:var(--gold);width:16px;border-radius:3px}
.scrollarea{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.scrollarea::-webkit-scrollbar{display:none}
.hintbar{font-size:11px;color:var(--ink-faint);letter-spacing:2px;text-align:center;margin-top:10px}
/* ---------- 长安夜声 ---------- */
.music-fab{
  position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 13px);
  z-index:40;width:38px;height:38px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:2.5px;
  background:rgba(8,13,31,.6);border:1px solid var(--line);backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.45);transition:.2s;
}
.music-fab:active{transform:scale(.9)}
.music-fab i{display:block;width:2.5px;height:15px;border-radius:2px;background:var(--gold-l);opacity:.32;transform:scaleY(.33);transform-origin:bottom;transition:.3s}
.music-fab.on i{opacity:.95;animation:eq .95s ease-in-out infinite}
.music-fab.on i:nth-child(2){animation-delay:.16s}
.music-fab.on i:nth-child(3){animation-delay:.32s}
.music-fab.on i:nth-child(4){animation-delay:.48s}
.music-fab.off::after{content:"";position:absolute;width:21px;height:1.5px;border-radius:2px;background:var(--ink-dim);transform:rotate(-45deg)}
@keyframes eq{0%,100%{transform:scaleY(.33)}50%{transform:scaleY(1)}}
.music-hint{font-size:11.5px;letter-spacing:2px;color:var(--ink-faint);margin-top:16px}
.music-hint b{color:var(--gold-l);font-weight:400}
/* ── 可达性基线（ui-skills）：键盘焦点可见 + 尊重系统"减少动态效果" ── */
:focus-visible{outline:2px solid rgba(232,196,118,.85);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .gen-poem.appear .pl{opacity:1;filter:none}
}
</style>
</head>
<body>
<div id="phone">

  <!-- ═══════ 01 进入长安 ═══════ -->
  <section class="screen" id="s-home">
    <div class="bg"><img data-img="s01-home" alt=""></div><div class="shade"></div>
    <div class="content">
      <div class="home-brand">数 字 诗 境 · 长 安</div>
      <h1 class="home-title">长安诗境</h1>
      <div class="home-sub">夜游千年长安 · 用选择续写一首诗</div>
      <div class="home-quote">你不是在参观长安，<br>而是在用自己的选择续写一首长安诗。</div>
      <div class="home-btns">
        <button class="btn" onclick="go('map')">进 入 长 安</button>
        <button class="btn ghost" onclick="go('shihui')">线上诗会</button>
      </div>
      <div class="music-hint">♪ 轻触「进入长安」· <b>开启长安夜声</b></div>
    </div>
  </section>

  <!-- ═══════ 02 数字长安地图 ═══════ -->
  <section class="screen" id="s-map">
    <div class="bg"><img data-img="s02-map" alt=""></div><div class="shade"></div>
    <div class="topbar"><div class="backbtn" role="button" tabindex="0" aria-label="返回" onclick="go('home')">‹</div><div class="screen-title">数字长安</div></div>
    <div class="content">
      <div class="layer-tabs" id="layerTabs">
        <div class="layer-tab on" data-layer="person" role="button" tabindex="0" onclick="setLayer('person')">人 物</div>
        <div class="layer-tab" data-layer="space" role="button" tabindex="0" onclick="setLayer('space')">空 间</div>
        <div class="layer-tab" data-layer="theme" role="button" tabindex="0" onclick="setLayer('theme')">主 题</div>
      </div>
      <div class="map-stage" id="mapStage"><img data-img="s02-map" alt=""></div>
      <div class="map-hint" id="mapHint">点击光点 · 进入诗境</div>

  {line:"床前明月光", from:"李白《静夜思》"},{line:"疑是银河落九天", from:"李白《望庐山瀑布》"},
  {line:"轻舟已过万重山", from:"李白《早发白帝城》"},{line:"唯见长江天际流", from:"李白《黄鹤楼送孟浩然之广陵》"},
  {line:"会当凌绝顶", from:"杜甫《望岳》"},{line:"劝君更尽一杯酒", from:"王维《送元二使安西》"},
  {line:"夜来风雨声", from:"孟浩然《春晓》"},{line:"却话巴山夜雨时", from:"李商隐《夜雨寄北》"}
];
/* 生成模板（换一句时轮换） */
const GEN_PATTERNS = [
  [ "{A}起{B}间","{C}落{PLACE}前","心中{MOOD}意","说与{D}天" ],
  [ "何处{A}声","{PLACE}月自明","{B}知{MOOD}浅","遥寄{C}行" ],
  [ "{A}初上{PLACE}头","{B}依旧照高楼","借君一句{MOOD}意","散作{C}满天秋" ],
  [ "我携{A}至","{PLACE}灯火生","{B}藏{MOOD}色","一句赠{C}城" ]
];

/* ═════════════ 全局状态 ═════════════ */
const S = {
  layer:"person", poetId:null, placeId:null,
  create:{step:1, images:[], mood:null, material:null, poem:null, patternIdx:0, userLine:"", from:"libai", placeName:"大雁塔"},
  works:[/* 诗会种子作品在 renderShihui 注入 */]
};
const $ = s=>document.querySelector(s);
const poet = id=>KB.poets.find(p=>p.id===id);
const poem = id=>KB.poems.find(p=>p.id===id);
function store(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
function load(k,d){ try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d} }

/* ═════════════ 路由 ═════════════ */
function go(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  const el = $("#s-"+name); if(!el) return;
  el.classList.add("active");
  if(name==="shihui") renderShihui();
  if(name==="create") renderCreate();
  if(name==="poets") renderPoets();
  stopVoice();
  Music.setScene(name);
}
function startRoam(){
  toast("漫游开启 · 选择你的叙事入口");
  $("#mapHint").textContent = "已开启漫游 · 点击光点进入诗境";
  document.querySelectorAll("#mapStage .hotspot .dot").forEach(d=>d.style.animationDuration="1.2s");
}

/* ═════════════ 地图 ═════════════ */
function setLayer(l){
  S.layer=l;
  document.querySelectorAll(".layer-tab").forEach(t=>t.classList.toggle("on",t.dataset.layer===l));
  renderHotspots();
}
function renderHotspots(){
  const stage=$("#mapStage");
  stage.querySelectorAll(".hotspot").forEach(h=>h.remove());
  const lit = load("litLandmarks",[]);
  HOTSPOTS[S.layer].forEach(h=>{
    const el=document.createElement("div");
    el.className="hotspot"+(lit.includes(h.id)?" lit":"");
    el.setAttribute("role","button"); el.setAttribute("tabindex","0"); el.setAttribute("aria-label",label);
    el.style.left=h.x+"%"; el.style.top=h.y+"%";
    const label = S.layer==="person"?poet(h.id).name : S.layer==="space"?KB.places[h.id]?.name||"长安" : KB.themes.find(t=>t.id===h.id).name;
    el.innerHTML=`<div class="dot"></div><div class="lbl">${label}</div>`;
    el.onclick=()=>{
      if(S.layer==="person") openPoet(h.id);
      else if(S.layer==="space") openPlace(h.id);
      else openTheme(h.id);
    };
    stage.appendChild(el);
  });
}

/* ═════════════ 人物 ═════════════ */
function renderPoets(){
  const g=$("#poetGrid"); g.innerHTML="";
  KB.poets.forEach(p=>{
    const c=document.createElement("div");
    c.className="poet-card";
    c.setAttribute("role","button"); c.setAttribute("tabindex","0"); c.setAttribute("aria-label",p.name+"，"+p.title);
    c.innerHTML=`<div class="p-name">${p.name}</div><div class="p-title">${p.title}</div><div class="p-era">${p.era}</div>`;
    c.onclick=()=>openPoet(p.id);
    g.appendChild(c);
  });
}
function openPoet(id){
  S.poetId=id; const p=poet(id);
  const poms=KB.poems.filter(x=>x.poetId===id);
  $("#poetPageTitle").textContent=p.name+" · 诗境";
  const bg = id==="libai"?IMG["s04-libai"]:IMG["s03-poets"];
  $("#s-poet .bg img").src=bg;
  $("#poetPageBody").innerHTML=`
    <div class="scrollarea">
      <div style="text-align:center;margin:6px 0 10px">
        <div class="big-name">${p.name}</div>
        <div class="big-sub">${p.title} · ${p.era}</div>
        <div style="margin-top:10px">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <div class="panel" style="padding:14px 16px;margin-bottom:14px">
        <div style="font-size:14.5px;line-height:1.9;color:var(--ink-dim);letter-spacing:1px">${p.intro}</div>
        <div class="hr"></div>
        <span class="voice-btn" role="button" tabindex="0" onclick="speak(['${p.name}，${p.title}。','${p.intro}'])"><span class="ic">▶</span> 语音导览</span>
      </div>
      <div class="divider-title">代 表 诗 境</div>
      ${poms.slice(0,4).map(x=>`
        <div class="poem-list-item" role="button" tabindex="0" onclick="openPoemSheet('${x.id}')">
          <div><div class="t">《${x.title}》</div><div class="f">${x.lines[0]} · ${x.form}</div></div>
          <div style="color:var(--gold);font-size:18px">›</div>
        </div>`).join("")}
    </div>
    ${id==="libai"?`<div style="margin-top:12px"><button class="btn" onclick="openPlace('dayanta')">前 往 大 雁 塔</button></div>`:
      `<div style="margin-top:12px"><button class="btn ghost" onclick="go('map')">回到长安地图</button></div>`}`;
  go("poet");
}

/* ═════════════ 地标诗境 ═════════════ */
function openPlace(id){
  if(!KB.places[id]) { toast("此处暂未开放"); return; }
  S.placeId=id; const pl=KB.places[id];
  const poms=(PLACE_POEMS[id]||[]).map(poem);
  const lit=load("litLandmarks",[]).includes(id);
  $("#placePageTitle").textContent=pl.name+" · 诗境";
  $("#s-place .bg img").src = id==="dayanta"?IMG["s05-dayanta"]:IMG["s02-map"];
  $("#placePageBody").innerHTML=`
    <div class="scrollarea">
      <div style="text-align:center;margin:4px 0 12px">
        <div class="big-name" style="font-size:36px">${pl.name}</div>
        <div class="big-sub">${pl.type}${lit?" · 已点亮 ✦":""}</div>
      </div>
      <div class="scroll-panel" style="margin-bottom:14px">
        <div style="font-size:14.5px;line-height:2;color:var(--ink);letter-spacing:1px">${pl.intro}</div>
        <div class="hr"></div>
        <span class="voice-btn" role="button" tabindex="0" onclick="speak(['${pl.name}。','${pl.intro}'])"><span class="ic">▶</span> 语音导览</span>
      </div>
      <div class="divider-title">此 处 诗 篇</div>
      ${poms.map(x=>`
        <div class="poem-list-item" role="button" tabindex="0" onclick="openPoemSheet('${x.id}')">
          <div><div class="t">《${x.title}》 <span style="font-size:11px;color:var(--ink-faint)">${poet(x.poetId).name}</span></div>
          <div class="f">${x.lines[0]}</div></div>
          <div style="color:var(--gold);font-size:18px">›</div>
        </div>`).join("")}
    </div>
    <div style="margin-top:12px;display:flex;gap:9px">
      <button class="btn ghost" style="flex:1" onclick="toast('已收藏此诗境')">收 藏</button>
      <button class="btn" style="flex:1.6" onclick="S.create.placeName='${pl.name}';go('shihui')">加入线上诗会</button>
    </div>`;
  go("place");
}
function openTheme(id){
  const t=KB.themes.find(x=>x.id===id); if(!t) return;
  const poms=(THEME_POEMS[id]||[]).map(poem);
  openSheet(`
    <div style="text-align:center;margin-bottom:14px">
      <div class="big-name" style="font-size:32px">主题 · ${t.name}</div>
      <div style="margin-top:8px">${t.moods.map(m=>`<span class="tag">${m}</span>`).join("")}</div>
    </div>
    ${poms.map(x=>`
      <div class="poem-list-item" role="button" tabindex="0" onclick="openPoemSheet('${x.id}')">
        <div><div class="t">《${x.title}》 <span style="font-size:11px;color:var(--ink-faint)">${poet(x.poetId).name}</span></div>
        <div class="f">${x.lines[0]}</div></div>
        <div style="color:var(--gold);font-size:18px">›</div>
      </div>`).join("")}`);
}

/* ═════════════ 阅读抽屉 ═════════════ */
function openSheet(html){ $("#sheetBody").innerHTML=html; $("#sheet").classList.add("show"); $("#sheetMask").classList.add("show"); }
function closeSheet(){ $("#sheet").classList.remove("show"); $("#sheetMask").classList.remove("show"); stopVoice(); }
function openPoemSheet(id){
  const x=poem(id), p=poet(x.poetId);
  openSheet(`
    <div style="text-align:center;margin-bottom:6px">
      <div class="big-name" style="font-size:30px">${x.title}</div>
      <div class="big-sub">${p.name} · ${x.form}</div>
    </div>
    <div style="text-align:center;padding:12px 0 4px">
      ${x.lines.map(l=>`<div class="poem-line" style="font-size:21px">${l}</div>`).join("")}
      <div class="poem-src">${x.intro}</div>
    </div>
    <div style="text-align:center;margin:14px 0 4px">
      <span class="voice-btn" role="button" tabindex="0" onclick="speak(['${x.title}。','${x.lines.join("','")}'])"><span class="ic">▶</span> 听 诗</span>
    </div>
    <div class="hr"></div>
    <button class="btn" onclick="startCreateFrom('${id}')">以此诗为素材 · 与${p.name}共创</button>`);
}

/* ═════════════ 线上诗会 ═════════════ */
let seedWorks=[
  {id:"w1",author:"游客 · 望舒",poem:["塔影落曲江","灯火照长安","一夜思乡意","明月入诗行"],material:"李白《静夜思》",lamp:load("lamp_w1",12)},
  {id:"w2",author:"游客 · 拾光",poem:["何处玉笛声","春风自分明","杨柳知别浅","遥寄故人行"],material:"王维《送元二使安西》",lamp:load("lamp_w2",8)},
  {id:"w3",author:"游客 · 临安",poem:["长风初上塔头","明月依旧照高楼","借君一句豪迈意","散作灯火满天秋"],material:"李白《早发白帝城》",lamp:load("lamp_w3",21)}
];
function myWorks(){ return load("myWorks",[]); }
function backFromShihui(){ go(S.placeId?"place":"map"); }
function renderShihui(){
  const mine=myWorks();
  const lit=load("litLandmarks",[]);
  $("#shihuiBody").innerHTML=`
    <div class="scrollarea">
      <div class="panel" style="padding:16px;margin-bottom:14px;text-align:center">
        <div style="font-size:12px;letter-spacing:4px;color:var(--ink-faint)">本 周 主 题</div>
        <div class="big-name" style="font-size:30px;margin-top:6px">长安夜色</div>
        <div style="font-size:12.5px;color:var(--ink-dim);margin-top:8px;letter-spacing:2px">已有 1,286 位游客在此留下诗句</div>
      </div>
      <div class="divider-title">游 客 作 品</div>
      ${seedWorks.map(w=>`
        <div class="work-card">
          <div class="w-head">
            <div class="w-author">${w.author} <span style="color:var(--ink-faint);font-size:11px">· 借材${w.material}</span></div>
            <div class="lamp-btn ${load("lampd_"+w.id,false)?"lit":""}" onclick="lamp('${w.id}',this)">🏮 <span>${w.lamp}</span></div>
          </div>
          <div class="w-poem">${w.poem.join("，").replace(/，([^，]*)$/,"。$1")}</div>
        </div>`).join("")}
      ${mine.length?`<div class="divider-title">我 的 作 品</div>`+mine.map((w,i)=>`
        <div class="work-card">
          <div class="w-head">
            <div class="w-author">我 · 借材${w.material||"—"}</div>
            <div class="lamp-btn" onclick="toast('为作品点灯 🏮')">🏮 <span>${w.lamp||1}</span></div>
          </div>
          <div class="w-poem" role="button" tabindex="0" style="cursor:pointer" onclick="viewMyWork(${i})">${w.poem.join("，").replace(/，([^，]*)$/,"。$1")}</div>
        </div>`).join(""):""}
      <div class="hintbar">离开景区后，也能随时回来看看别人的长安</div>
    </div>
    <div style="margin-top:12px">
      <button class="btn" onclick="startCreate()">✦ 与李白共创</button>
    </div>`;
}
function lamp(id,el){
  const key="lampd_"+id, w=seedWorks.find(x=>x.id===id);
  if(load(key,false)){ toast("已点过灯啦"); return; }
  store(key,true); w.lamp++; store("lamp_"+id,w.lamp);
  el.classList.add("lit"); el.querySelector("span").textContent=w.lamp;
  toast("你为这首诗点了一盏灯 🏮");
}
function viewMyWork(i){ const w=myWorks()[i]; S.create.poem=w.poem; S.create.material=w.material; S.create.placeName=w.placeName||"大雁塔"; drawPoster(); go("poster"); }

/* ═════════════ 共创 ═════════════ */
function curScreen(){ const a=document.querySelector(".screen.active"); return a?a.id.replace(/^s-/,""):"map"; }
function startCreate(){ S.create.step=1; S.create.backTo=curScreen(); renderCreate(); go("create"); }
function startCreateFrom(poemId){
  const x=poem(poemId);
  S.create.material=x.lines[0]+" —— "+poet(x.poetId).name+"《"+x.title+"》";
  closeSheet(); startCreate();
  toast("已选素材：”"+x.lines[0]+"“");
}
function createBack(){
  if(S.create.step>1 && !S.create.poem){ S.create.step--; renderCreate(); }
  else go(S.create.backTo||"poet");
}
/* 步骤推进：一步(意象) → 二步(情绪) → 三步(素材) */
function createNext(){
  const c=S.create;
  if(c.step===1){
    if(c.images.length<2){ toast("至少选 2 个意象，它们要织进你的诗里"); return; }
    c.step=2; renderCreate();
  }else if(c.step===2){
    if(!c.mood){ toast("先为这句诗选一种情绪"); return; }
    c.step=3; renderCreate();
  }else{
    generate();
  }
}
function renderCreate(){
  const c=S.create;
  const head=`<div class="steps">
      <div class="step-dot ${c.step>=1?"on":""}"></div>
      <div class="step-dot ${c.step>=2?"on":""}"></div>
      <div class="step-dot ${c.step>=3?"on":""}"></div>
    </div>`;
  if(c.poem){ renderPoemResult(); return; }
  if(c.step===1){
    $("#createTitle").textContent="共创 · 一步/三";
    $("#createBody").innerHTML=head+`
      <div class="scrollarea">
        <div class="big-sub" style="margin:4px 0 2px">此刻你看见的长安是什么？</div>
        <div style="font-size:12.5px;color:var(--ink-faint);letter-spacing:2px;margin-bottom:12px">选择 2 – 4 个意象，它们将织入你的诗</div>
        <div class="chip-row">${IMAGERY.map(m=>`<div class="chip ${c.images.includes(m)?"on":""}" role="button" tabindex="0" onclick="pickImg('${m}',this)">${m}</div>`).join("")}</div>
      </div>
      <div class="hintbar">已选 ${c.images.length}/4</div>
      <button class="btn" style="margin-top:10px" onclick="createNext()">下 一 步 · 选 情 绪 ${c.images.length>=2?"":"（还差 "+(2-c.images.length)+" 个）"}</button>`;
  }else if(c.step===2){
    $("#createTitle").textContent="共创 · 二步/三";
    $("#createBody").innerHTML=head+`
      <div class="scrollarea">
        <div class="big-sub" style="margin:4px 0 2px">为这句诗选一种情绪</div>
        <div style="font-size:12.5px;color:var(--ink-faint);letter-spacing:2px;margin-bottom:12px">你的情绪会决定诗的走向</div>
        <div class="chip-row">${MOODS.map(m=>`<div class="chip ${c.mood===m?"on":""}" role="button" tabindex="0" onclick="pickMood('${m}')">${m}</div>`).join("")}</div>
      </div>
      <button class="btn" style="margin-top:10px" ${c.mood?"":"disabled"} onclick="createNext()">下 一 步 · 选 素 材</button>`;
  }else{
    $("#createTitle").textContent="共创 · 三步/三";
    $("#createBody").innerHTML=head+`
      <div class="scrollarea">
        <div class="big-sub" style="margin:4px 0 2px">借一句唐诗，开始你的创作</div>
        <div style="font-size:12.5px;color:var(--ink-faint);letter-spacing:2px;margin-bottom:12px">诗句会作为题记出现在你的海报上</div>
        ${MATERIALS.map((m,i)=>`
          <div class="poem-list-item" role="button" tabindex="0" onclick="pickMaterial(${i})">
            <div><div class="t">「${m.line}」</div><div class="f">${m.from}</div></div>
            <div style="color:var(--gold);font-size:18px">${c.material&&c.material.startsWith(m.line)?"✓":"›"}</div>
          </div>`).join("")}
      </div>
      <button class="btn" style="margin-top:10px" ${c.material?"":"disabled"} onclick="generate()">✦ 生 成 我 的 长 安 诗</button>`;
  }
}
function pickImg(m,el){
  const c=S.create, i=c.images.indexOf(m);
  if(i>=0)c.images.splice(i,1);
  else if(c.images.length<4)c.images.push(m);
  else{toast("最多选 4 个意象");return;}
  el.classList.toggle("on");
  document.querySelector("#createBody .hintbar").textContent=`已选 ${c.images.length}/4`;
  const btn=document.querySelector("#createBody .btn");
  if(btn) btn.textContent = c.images.length>=2 ? "下 一 步 · 选 情 绪" : `下 一 步 · 选 情 绪（还差 ${2-c.images.length} 个）`;
}
function pickMood(m){ S.create.mood=m; renderCreate(); }
function pickMaterial(i){
  const m=MATERIALS[i]; S.create.material=m.line+" —— "+m.from;
  renderCreate();
}
function generate(){
  const c=S.create;
  if(c.images.length<2){toast("再选至少 2 个意象吧");return;}
  makePoem();
  Music.sfx("chime");
  renderCreate();
}
function makePoem(){
  const c=S.create;
  const imgs=[...c.images]; while(imgs.length<4)imgs.push(IMAGERY[(imgs.length*7+3)%IMAGERY.length]);
  const [A,B,C,D]=imgs;
  const pat=GEN_PATTERNS[c.patternIdx%GEN_PATTERNS.length];
  c.poem=pat.map(t=>t.replace("{A}",A).replace("{B}",B).replace("{C}",C).replace("{D}",D).replace("{PLACE}",c.placeName||"长安").replace("{MOOD}",c.mood||"怀古"));
}
function renderPoemResult(){
  const c=S.create;
  $("#createTitle").textContent="你 的 长 安 诗";
  $("#createBody").innerHTML=`
    <div class="scrollarea" style="display:flex;flex-direction:column;justify-content:center">
      <div style="text-align:center;margin-bottom:8px">
        <div class="big-sub" style="margin:0">与李白 · 于${c.placeName}</div>
      </div>
      <div class="panel gen-poem appear" id="genPoem">
        ${c.poem.map(l=>`<div class="pl">${l}</div>`).join("")}
        ${c.userLine?`<div class="pl" style="color:var(--gold-l);font-size:19px;margin-top:6px">—— ${c.userLine}</div>`:""}
        <div class="poem-src" style="margin-top:12px">题记：${c.material||""}</div>
      </div>
      <div class="gen-tools">
        <span class="voice-btn" role="button" tabindex="0" onclick="speak(['${c.poem.join("','")}'])"><span class="ic">▶</span> 听我读</span>
      </div>
      <div class="gen-tools" style="margin-top:14px">
        <button class="btn ghost small" onclick="remake()">换一句</button>
        <button class="btn ghost small" onclick="S.create.step=2;S.create.poem=null;S.create.userLine='';renderCreate()">改情绪</button>
        <button class="btn ghost small" onclick="toggleUserLine()">加入我的一句</button>
      </div>
      <div id="userLineBox" style="display:none">
        <textarea class="userline" rows="2" maxlength="20" placeholder="写下一句你自己的诗（20 字内）">${c.userLine||""}</textarea>
        <button class="btn ghost small" style="margin-top:8px;width:100%" onclick="saveUserLine()">收下这一句</button>
      </div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="finishPoem()">生 成 作 品 海 报</button>`;
}
function remake(){ S.create.patternIdx++; makePoem(); renderPoemResult(); toast("再试一版"); }
function toggleUserLine(){ const b=$("#userLineBox"); b.style.display=b.style.display==="none"?"block":"none"; }
function saveUserLine(){
  const v=document.querySelector(".userline").value.trim();
  if(!v){toast("先写一句吧");return;}
  S.create.userLine=v; renderPoemResult(); toast("已加入你的句子");
}
function finishPoem(){
  const c=S.create;
  const works=myWorks();
  works.unshift({poem:c.poem,userLine:c.userLine,material:(c.material||"").split(" —— ")[0],mood:c.mood,placeName:c.placeName,lamp:1,time:Date.now()});
  store("myWorks",works.slice(0,9));
  drawPoster(); go("poster"); toast("作品已收入诗会");
}

/* ═════════════ 海报 ═════════════ */
function drawPoster(){
  const cv=$("#posterCanvas"), ctx=cv.getContext("2d");
  const c=S.create, W=cv.width, H=cv.height;
  const img=new Image();
  img.onload=()=>{
    ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0,W,H);
    // 卷轴中央区域 (依背景图比例约 x:24%-76%, y:21%-72%)
    const px=W*0.25, pw=W*0.5, py=H*0.225, ph=H*0.475;
    // 顶部题字（落在卷轴纸面上部）
    ctx.fillStyle="rgba(40,30,15,.85)";
    ctx.font='600 40px "Kaiti SC","STKaiti","KaiTi",serif';
    ctx.textAlign="center";
    ctx.fillText("长安诗笺", W/2, py+188);
    ctx.font='22px "Songti SC","STSong",serif';
    ctx.fillStyle="rgba(40,30,15,.65)";
    ctx.fillText("数字诗境长安 · 与君共创", W/2, py+226);
    // 诗（竖排，右起）
    const lines=[...c.poem]; if(c.userLine)lines.push(c.userLine);
    ctx.fillStyle="rgba(35,25,12,.92)";
    ctx.font='34px "Kaiti SC","STKaiti","KaiTi",serif';
    const colW=52, startX=px+pw-70, startY=py+292;
    lines.forEach((line,i)=>{
      const x=startX-i*colW;
      [...line].forEach((ch,j)=>{
        ctx.fillText(ch, x, startY+j*44);
      });
    });
    // 题记（左下小字）
    ctx.font='20px "Songti SC","STSong",serif';
    ctx.fillStyle="rgba(40,30,15,.6)";
    ctx.textAlign="left";
    wrapText(ctx, "题记 · "+(c.material||""), px+28, py+ph-110, pw-90, 28);
    // 印章
    ctx.fillStyle="#c3452f";
    const sx=px+34, sy=py+ph-92;
    roundRect(ctx,sx,sy,58,58,6); ctx.fill();
    ctx.fillStyle="#fff3e0"; ctx.font='700 20px "Kaiti SC","STKaiti",serif'; ctx.textAlign="center";
    ctx.fillText("诗",sx+29,sy+26); ctx.fillText("笺",sx+29,sy+50);
    // 底部信息
    ctx.font='22px "Songti SC","STSong",serif';
    ctx.fillStyle="rgba(40,30,15,.7)"; ctx.textAlign="center";
    const dt=new Date();
    const ds=`${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,"0")}.${String(dt.getDate()).padStart(2,"0")} 夜游`;
    ctx.fillText(ds+" · "+(c.placeName||"长安")+" · 情绪 · "+(c.mood||"—"), W/2, py+ph-24);
  };
  img.src=IMG["s08-poster"];
}
function wrapText(ctx,text,x,y,maxW,lh){
  let line="",yy=y;
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  if(line)ctx.fillText(line,x,yy);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function savePoster(){
  const a=document.createElement("a");
  a.download="长安诗笺.png"; a.href=$("#posterCanvas").toDataURL("image/png"); a.click();
  toast("海报已保存到相册（示意）");
}
async function sharePoster(){
  const c=S.create, text="【长安诗笺】\n"+c.poem.join("，").replace(/，([^，]*)$/,"。$1")+(c.userLine?"\n—— "+c.userLine:"")+"\n· 数字诗境长安";
  if(navigator.share){ try{ await navigator.share({title:"长安诗笺",text}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast("诗句已复制，去粘贴给朋友"); }
  catch(e){ toast(text.slice(0,40)+"…"); }
}

/* ═════════════ 语音导览（Web Speech · 已优选中文音色与断句） ═════════════ */
let speaking=false, zhVoice=null, voiceTimer=null;

/* 优选最自然的中文念白音色：系统高质量女声优先 */
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const all=speechSynthesis.getVoices()||[];
  if(!all.length) return;
  const zh=all.filter(v=>/^(zh|cmn)|Chinese|中文|普通话/i.test(v.lang+" "+v.name));
  if(!zh.length) return;
  const prefer=[
    /Tingting|Ting-Ting|婷婷/i,                       // iOS / macOS 中文女声（最自然）
    /Xiaoxiao|晓晓|Xiaoyi|晓伊|Xiaochen|云希/i,        // Windows / Edge 自然语音
    /Meijia|Mei-Jia|美佳|Sinji|善怡|Yu-shu|Li-mu/i,   // 美佳 / 粤语女声
    /Huihui|慧慧|Yaoyao|姚姚|Kangkang/i,
    /Google.*(普通话|Mandarin)|Google 普通话/i
  ];
  let hit=null;
  for(const re of prefer){ hit=zh.find(v=>re.test(v.name)); if(hit) break; }
  const picked=hit||zh.find(v=>/zh[-_]?CN|cmn/i.test(v.lang))||zh[0];
  if(picked&&(!zhVoice||picked.name!==zhVoice.name)) console.log("[长安夜声] 念白音色:", picked.name, "|", picked.lang);
  zhVoice=picked;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;   /* Chrome/Edge 异步加载音色 */
  setTimeout(pickVoice,300); setTimeout(pickVoice,1200); setTimeout(pickVoice,3000);
}

/* 按中文标点断句，让念白有自然停顿（不使用后行断言，兼容旧 WebView） */
function splitSent(t){
  const out=[]; let cur="";
  for(const ch of String(t)){ cur+=ch; if("。！？；…".includes(ch)){ if(cur.trim())out.push(cur.trim()); cur=""; } }
  if(cur.trim()) out.push(cur.trim());
  return out;
}

function speak(parts){
  const SS=window.speechSynthesis;
  if(!SS||typeof SpeechSynthesisUtterance==="undefined"){ toast("当前环境不支持语音朗读"); return; }
  if(speaking){ stopVoice(); return; }
  SS.cancel();
  if(!zhVoice) pickVoice();

  const chunks=[];
  parts.forEach(p=>splitSent(p).forEach(s=>chunks.push(s)));
  if(!chunks.length) return;

  const say=i=>{
    if(i>=chunks.length||!speaking){ stopVoice(); return; }
    const u=new SpeechSynthesisUtterance(chunks[i]);
    if(zhVoice) u.voice=zhVoice;
    u.lang=(zhVoice&&zhVoice.lang)||"zh-CN";
    u.rate=.9; u.pitch=1.04; u.volume=1;
    u.onend=()=>{ if(speaking) voiceTimer=setTimeout(()=>say(i+1),260); };
    u.onerror=()=>{ if(speaking) voiceTimer=setTimeout(()=>say(i+1),140); };
    SS.speak(u);
  };
  speaking=true;
  Music.duck(true);
  document.querySelectorAll(".voice-btn").forEach(b=>b.classList.add("playing"));
  say(0);
}
function stopVoice(){
  speaking=false;
  clearTimeout(voiceTimer);
  Music.duck(false);
  if("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll(".voice-btn").forEach(b=>b.classList.remove("playing"));
}

/* ═════════════ toast ═════════════ */
let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ═════════════ 长安夜声 · Web Audio 实时合成（零音频文件 / 无版权风险） ═════════════
   五声音阶 + 拨弦合成 + 反馈延迟混响 + 低音长鸣，按场景切换调式与节奏       */
const Music = (()=>{
  /* 五声调式（宫商角徵羽），每调 9 音 */
  const SCALES={
    gong :[220.00,246.94,277.18,329.63,369.99,440.00,493.88,554.37,659.25],
    shang:[196.00,220.00,246.94,293.66,329.63,392.00,440.00,493.88,587.33],
    yu   :[174.61,196.00,220.00,261.63,293.66,349.23,392.00,440.00,523.25],
    zhi  :[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99]
  };
  /* 场景：夜入 / 漫游 / 诗境 / 共创 / 诗会 */
  const SCENE={
    night :{sc:"shang",beat:1400,dens:.50,cut:850, dur:3.4,drone:[98.00,146.83],drum:0,   bell:.055},
    roam  :{sc:"gong", beat:880, dens:.68,cut:1300,dur:2.3,drone:[110.00,164.81],drum:.22,bell:.040},
    poem  :{sc:"yu",   beat:1750,dens:.42,cut:780, dur:3.8,drone:[87.31,130.81],drum:0,   bell:.070},
    create:{sc:"gong", beat:980, dens:.72,cut:1500,dur:2.4,drone:[123.47,185.00],drum:.16,bell:.035},
    feast :{sc:"zhi",  beat:720, dens:.86,cut:1750,dur:2.0,drone:[130.81,196.00],drum:.30,bell:.030}
  };
  /* 屏 → 场景 */
  const ROUTE={home:"night",map:"roam",poets:"roam",poet:"poem",place:"poem",shihui:"feast",create:"create",poster:"create"};

  let ctx=null,master=null,lim=null,dry=null,wetSend=null;
  let droneOsc=[],droneGain=null,droneLP=null;
  let buf=null,tick=null,idx=4,step=0;
  let sceneKey="night",cfg=SCENE.night;
  let playing=false,unlocked=false,ducked=false;
  let on=load("musicOn",true);

  const now=()=>ctx.currentTime;

  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    /* 总线 → 限幅器 → 输出（音量拉高也不炸） */
    lim=ctx.createDynamicsCompressor();
    lim.threshold.value=-3.5; lim.knee.value=8; lim.ratio.value=14;
    lim.attack.value=.004; lim.release.value=.22;
    lim.connect(ctx.destination);
    master=ctx.createGain(); master.gain.value=0.0001; master.connect(lim);

    /* 干声 */
    dry=ctx.createGain(); dry.gain.value=.9; dry.connect(master);

    /* 混响：三条反馈延迟（空灵、低开销，移动端友好） */
    wetSend=ctx.createGain(); wetSend.gain.value=1;
    const wetOut=ctx.createGain(); wetOut.gain.value=.44; wetOut.connect(master);
    [[0.113,.42],[0.179,.38],[0.263,.33]].forEach(([t,fb])=>{
      const d=ctx.createDelay(1.2); d.delayTime.value=t;
      const g=ctx.createGain(); g.gain.value=fb;
      const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2100;
      wetSend.connect(d); d.connect(lp); lp.connect(g); g.connect(d); lp.connect(wetOut);
    });

    /* 噪声源（拨弦瞬态 / 鼓） */
    const len=Math.floor(ctx.sampleRate*1.2);
    buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;

    buildDrone();
  }

  function buildDrone(){
    droneLP=ctx.createBiquadFilter(); droneLP.type="lowpass"; droneLP.frequency.value=520;
    droneGain=ctx.createGain(); droneGain.gain.value=0.0001;
    droneLP.connect(droneGain); droneGain.connect(dry); droneGain.connect(wetSend);
    /* 缓慢呼吸 */
    const lfo=ctx.createOscillator(); lfo.frequency.value=.06;
    const lg=ctx.createGain(); lg.gain.value=.022;
    lfo.connect(lg); lg.connect(droneGain.gain); lfo.start();
    cfg.drone.forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=f;
      const g=ctx.createGain(); g.gain.value=i?.45:1;
      o.connect(g); g.connect(droneLP); o.start();
      droneOsc.push(o);
    });
  }

  /* 拨弦音（古琴 / 琵琶质感） */
  function pluck(f,t,o){
    if(!ctx) return;
    const vol=(o.vol??1)*(ducked?.25:1);
    const out=ctx.createGain(); out.gain.value=.64*vol;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=.6;
    lp.frequency.setValueAtTime(o.cut,t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(280,o.cut*.32),t+o.dur);
    [[1,.50,o.dur],[2,.19,o.dur*.55],[3,.09,o.dur*.34],[4.01,.05,o.dur*.20]].forEach(([m,a,d])=>{
      const osc=ctx.createOscillator();
      osc.type=m<2?"triangle":"sine";
      osc.frequency.value=f*m;
      const g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(a,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      osc.connect(g); g.connect(lp); osc.start(t); osc.stop(t+d+.06);
    });
    const n=ctx.createBufferSource(); n.buffer=buf;
    const nf=ctx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=f*3; nf.Q.value=1.1;
    const ng=ctx.createGain();
    ng.gain.setValueAtTime(.15,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.08);
    n.connect(nf); nf.connect(ng); ng.connect(lp); n.start(t); n.stop(t+.12);
    lp.connect(out); out.connect(dry); out.connect(wetSend);
  }

  /* 钟声（大雁塔） */
  function bell(f,t,dur,vol){
    [[1,1],[2.76,.4],[5.4,.18]].forEach(([m,a])=>{
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=f*m;
      const g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(a*vol,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(dry); g.connect(wetSend); o.start(t); o.stop(t+dur+.05);
    });
  }

  /* 鼓点 */
  function drum(t){
    const o=ctx.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(64,t); o.frequency.exponentialRampToValueAtTime(40,t+.28);
    const g=ctx.createGain();
    g.gain.setValueAtTime(.30*(ducked?.2:1),t); g.gain.exponentialRampToValueAtTime(.0001,t+.34);
    o.connect(g); g.connect(dry); o.start(t); o.stop(t+.4);
    const n=ctx.createBufferSource(); n.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=340;
    const ng=ctx.createGain();
    ng.gain.setValueAtTime(.10*(ducked?.2:1),t); ng.gain.exponentialRampToValueAtTime(.0001,t+.16);
    n.connect(f); f.connect(ng); ng.connect(dry); n.start(t); n.stop(t+.2);
  }

  function schedule(){
    if(!ctx) return;
    const t=now()+.06;
    step++;
    const scale=SCALES[cfg.sc];
    if(step%4===1) pluck(scale[0]/2,t,{dur:cfg.dur*1.7,cut:cfg.cut*.62,vol:1.15});
    if(Math.random()<cfg.dens){
      idx=Math.max(0,Math.min(8,idx+(Math.random()<.5?1:-1)*Math.round(Math.random()*2.4)));
      const vol=.5+Math.random()*.4;
      pluck(scale[idx],t,{dur:cfg.dur,cut:cfg.cut,vol});
      if(Math.random()<.14) pluck(scale[Math.min(8,idx+1)],t+.14,{dur:cfg.dur*.75,cut:cfg.cut,vol:vol*.6});
    }
    if(cfg.drum&&Math.random()<cfg.drum) drum(t);
    if(Math.random()<cfg.bell) bell(587.33,t,5.2,.055);
    if(tick) tick=setTimeout(schedule,cfg.beat*(.88+Math.random()*.28));
  }

  function ui(){
    const el=document.getElementById("musicFab"); if(!el) return;
    el.classList.toggle("on",playing&&!ducked);
    el.classList.toggle("off",!playing);
  }

  function start(){
    if(!unlocked) return;
    init(); if(!ctx) return;
    ctx.resume();
    if(playing) return;
    playing=true;
    master.gain.cancelScheduledValues(now());
    master.gain.setTargetAtTime(ducked?.12:.95,now(),.9);
    droneGain.gain.setTargetAtTime(.075,now(),1.6);
    if(tick) clearTimeout(tick);
    tick=1; schedule();
    ui();
  }
  function stop(){
    if(!ctx) return;
    playing=false;
    master.gain.setTargetAtTime(.0001,now(),.45);
    droneGain.gain.setTargetAtTime(.0001,now(),.45);
    if(tick){ clearTimeout(tick); tick=null; }
    ui();
  }

  function unlock(){
    if(unlocked) return;
    init(); if(!ctx) return;
    unlocked=true;
    ctx.resume&&ctx.resume();
    if(on) start();
    ui();
  }

  function setScene(k){
    k=ROUTE[k]||k;
    if(!ctx||k===sceneKey) return;
    sceneKey=k; cfg=SCENE[k];
    droneOsc.forEach((o,i)=>o.frequency.setTargetAtTime(cfg.drone[i],now(),.9));
    if(playing){ if(tick) clearTimeout(tick); tick=1; schedule(); }
  }

  function toggle(){
    unlock();
    on=!on; store("musicOn",on);
    if(on){ start(); toast("长安夜声 · 已开启"); }
    else{ stop(); toast("已静音 · 点击右上角可再开"); }
  }

  /* 语音导览时自动压低声场 */
  function duck(v){
    ducked=!!v;
    if(!ctx||!playing) return;
    master.gain.setTargetAtTime(ducked?.12:.95,now(),.25);
    ui();
  }

  /* 单击短音（木鱼 + 磬） */
  function tone(f,dur,vol,t,type){
    const o=ctx.createOscillator(); o.type=type||"sine"; o.frequency.value=f;
    const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dry); g.connect(wetSend); o.start(t); o.stop(t+dur+.03);
  }

  /* 交互音效：按键 / 返回 / 生成 / 点亮 */
  function sfx(kind){
    if(!ctx||!unlocked||!playing) return;
    const t=now()+.005, v=ducked?.35:1;
    if(kind==="chime"){ bell(1046.50,t,3.0,.24*v); bell(1568.00,t+.08,2.4,.14*v); return; }
    if(kind==="back"){
      tone(392.00,.22,.20*v,t,"triangle");
      tone(261.63,.28,.14*v,t+.02,"sine");
      return;
    }
    /* 按键：清脆一声（磬 + 木鱼瞬态） */
    tone(1760.00,.10,.34*v,t,"triangle");
    tone(1174.66,.22,.24*v,t,"sine");
    const n=ctx.createBufferSource(); n.buffer=buf;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2400; bp.Q.value=.8;
    const ng=ctx.createGain();
    ng.gain.setValueAtTime(.32*v,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.05);
    n.connect(bp); bp.connect(ng); ng.connect(dry); ng.connect(wetSend); n.start(t); n.stop(t+.09);
  }

  /* 调试 / 演示用：实时输出电平 */
  function meter(){
    if(!ctx) return null;
    const an=ctx.createAnalyser(); an.fftSize=2048;
    master.connect(an);
    const d=new Uint8Array(an.fftSize);
    return ()=>{ an.getByteTimeDomainData(d); let s=0; for(let i=0;i<d.length;i++){const v=(d[i]-128)/128; s+=v*v;} return Math.sqrt(s/d.length); };
  }

  return {unlock,start,stop,toggle,setScene,duck,sfx,meter,toggleState:()=>on,state:()=>ctx?ctx.state:"none"};
})();

/* 首次触摸即解锁音频（微信 / iOS 必须有用户手势） */
["pointerdown","touchend","click"].forEach(ev=>
  document.addEventListener(ev,()=>Music.unlock(),{passive:true}));

/* 全局交互音效 */
document.addEventListener("click",e=>{
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest("#musicFab")) return;
  if(t.closest(".backbtn")){ Music.sfx("back"); return; }
  if(t.closest(".btn,.layer-tab,.hotspot,.poet-card,.chip,.work-card,.voice-btn,.sheet-item")) Music.sfx("tap");
},{passive:true});

/* ── 键盘访问：Enter/Space 触发 role="button"，Esc 关面板并停止朗读 ── */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeSheet(); return; }
  const t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t&&t.matches&&t.matches('[role="button"]')){
    e.preventDefault(); t.click();
  }
});

renderHotspots();
go("home");
