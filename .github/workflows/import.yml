name: import-site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: import-site
  cancel-in-progress: false

jobs:
  import:
    if: github.event.head_commit.message != 'import: sync site snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest site snapshot
        run: |
          BASE="https://vfi0231u.html2link.dev"
          for f in index.html cytoscape.min.js cytoscape-fcose.min.js graph.js poets.js meta.js lz-string.min.js favicon.svg; do
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$BASE/$f" -o "$f"
          done
          printf "" > .nojekyll
          sed -i 's|<base href="[^"]*">||g' index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "import: sync site snapshot"
            git push
          fi
